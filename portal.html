<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Reggie & Partners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .animate-on-scroll { opacity: 0; transform: translateY(40px); transition: all 0.8s ease-out; }
        .animate-on-scroll.visible { opacity: 1; transform: translateY(0); }
        #messages { height: 450px; overflow-y: scroll; background: #f8f9fa; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #1e2a44;">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">⚖️ Reggie & Partners</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Our Team</a></li>
                    <li class="nav-item"><a class="nav-link active" href="portal.html">Client Portal</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <a href="contact.html" class="btn btn-warning ms-lg-4">📞 Book Consultation</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <h1 class="text-center mb-5 animate-on-scroll">Client Portal</h1>

        <!-- Case Submission -->
        <div class="card mb-5 animate-on-scroll">
            <div class="card-header bg-primary text-white">
                <h5>Submit New Case</h5>
            </div>
            <div class="card-body">
                <form id="caseForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Full Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Case Type</label>
                            <select class="form-control" required>
                                <option>Criminal Law</option>
                                <option>Family Law</option>
                                <option>Corporate Law</option>
                                <option>Civil Litigation</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Case Description</label>
                        <textarea class="form-control" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Submit Case</button>
                </form>
            </div>
        </div>

        <!-- Messaging -->
        <div class="card animate-on-scroll">
            <div class="card-header bg-success text-white">
                <h5>Messages with Your Advocate</h5>
            </div>
            <div class="card-body" id="messages"></div>
            <div class="card-footer">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-5 text-center">
        <p>&copy; 2026 Reggie & Partners Law Firm. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let messages = [
            {from: "Advocate", text: "Good day. I have reviewed your file."},
            {from: "You", text: "Thank you for the update."}
        ];

        function renderMessages() {
            const div = document.getElementById('messages');
            div.innerHTML = messages.map(m => `
                <div class="mb-3"><strong>${m.from}:</strong> ${m.text}</div>
            `).join('');
            div.scrollTop = div.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (input.value.trim()) {
                messages.push({from: "You", text: input.value});
                renderMessages();
                input.value = '';
                setTimeout(() => {
                    messages.push({from: "Advocate", text: "I will revert shortly with next steps."});
                    renderMessages();
                }, 800);
            }
        }

        document.getElementById('caseForm').addEventListener('submit', e => {
            e.preventDefault();
            alert("Case submitted successfully!");
            e.target.reset();
        });

        const observer = new IntersectionObserver((e) => e.forEach(entry => entry.isIntersecting && entry.target.classList.add('visible')), {threshold: 0.2});
        document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));

        renderMessages();
    </script>
</body>
</html>
